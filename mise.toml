# Monorepo mode: makes each config_root's tasks addressable from the
# repo root as //<root>:<task> (e.g. mise //gems/conduit:mssql:up).
# Requires mise >= 2026.7
monorepo_root = true

[monorepo]
config_roots = [
  "apps/clinical_exchange",
  "gems/conduit"
]

[tools]
# gh is the GitHub CLI. bin/ci signs off through it via the
# basecamp/gh-signoff extension, installed separately with
# `gh extension install basecamp/gh-signoff`.
gh = "2.97.0"
postgres = "18.4"
ruby = "4.0.6"
nodejs = "26.5.1"
yarn = "4.18.0"

