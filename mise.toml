[tools]
postgres = "17.9"
ruby = "3.3.5"
nodejs = "24.15.0"
yarn = "4.14.0"

[env]
AWS_CONFIG_FILE = ".aws/config"
LOCATION = "local"
PGDATA = "./tmp/.postgres/data"
PGPORT = 5500
PGUSER = "postgres"
PGPASSWORD = "postgres"

[tasks."_init"]
description = "initialize the data folder first time setting it up"
run = """
echo "postgres" > ./tmp/.pgpass_tmp
initdb --locale=en_US.UTF-8 --username=postgres --pwfile=./tmp/.pgpass_tmp
"""

[tasks."db:start"]
description = "Start postgres"
run = "pg_ctl start"

[tasks."db:stop"]
description = "Stop postgres"
run = "pg_ctl stop"
