name: Clinical Exchange

on:
  push:
    paths:
      - "apps/clinical_exchange/**"
      - "gems/**"
      - ".github/workflows/clinical_exchange.yml"

concurrency:
  group: clinical-exchange-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/clinical_exchange

jobs:
  herb:
    name: Herb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/clinical_exchange/.node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore the Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('apps/clinical_exchange/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Lint HTML+ERB templates
        run: yarn herb:lint

      - name: Check HTML+ERB formatting
        run: yarn herb:format:check

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/clinical_exchange
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('apps/clinical_exchange/.ruby-version', 'apps/clinical_exchange/**/.rubocop.yml', 'apps/clinical_exchange/Gemfile.lock') }}
        with:
          path: apps/clinical_exchange/tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/clinical_exchange
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities
        run: bin/brakeman --no-pager

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [ herb, rubocop, brakeman ]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/clinical_exchange
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/clinical_exchange/.node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore the Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('apps/clinical_exchange/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Prepare the test database
        run: bin/rails db:prepare

      - name: Run the test suite
        run: bundle exec rspec
