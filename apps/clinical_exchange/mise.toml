# Local Postgres cluster for clinical_exchange, following the recipe
# commented out in the repo root mise.toml. The cluster lives under
# tmp/, so it is disposable and already gitignored by Rails.
#
# First run:  mise run db:init && mise run db:start && bin/rails db:prepare
# After that: mise run db:start / mise run db:stop
#
# These tasks manage the Postgres server only. Rails owns the databases
# inside it — create them with bin/rails db:prepare.

[env]
PGDATA = "./tmp/.postgres/data"
PGPORT = "5510"
PGUSER = "postgres"
PGPASSWORD = "postgres"

[tasks."db:_init"]
description = "Create the Postgres data directory (first run only)"
run = """
echo "postgres" > ./tmp/.pgpass_tmp
initdb --locale=en_US.UTF-8 --username=postgres --pwfile=./tmp/.pgpass_tmp
"""

[tasks."db:start"]
description = "Start Postgres"
run = "pg_ctl start -l ./tmp/postgres.log -o '-c log_min_messages=error'"

[tasks."db:stop"]
description = "Stop Postgres"
run = "pg_ctl stop"
